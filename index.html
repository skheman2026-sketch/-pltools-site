<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>验盘师 · Polymarket 决议风险日报</title>
<meta name="description" content="Polymarket 决议风险审计：每日 TOP50 待审盘面，证据可对质。">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="验盘师">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="app.webmanifest">
<style>
:root{color-scheme:light dark;
 --bg:#f6f7f9;--card:#ffffff;--ink:#1c2330;--sub:#5b6472;--line:#e4e8ee;
 --green:#1a7f37;--yellow:#9a6700;--red:#c1341b;--chip:#eef1f5;--accent:#2456c8}
@media (prefers-color-scheme:dark){:root{
 --bg:#101318;--card:#181d25;--ink:#e7ecf3;--sub:#98a2b3;--line:#2a313c;
 --green:#4ac26b;--yellow:#d4a72c;--red:#ff6a4d;--chip:#232a35;--accent:#7ba3ff}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
 padding:max(10px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
header{max-width:720px;margin:0 auto 10px}
h1{font-size:20px;letter-spacing:.5px}
.sub{color:var(--sub);font-size:13px;margin-top:2px}
.banner{max-width:720px;margin:0 auto 10px;padding:9px 12px;border-radius:10px;font-size:13px;display:none}
.banner.warn{display:block;background:color-mix(in srgb,var(--yellow) 14%,var(--card));border:1px solid var(--yellow)}
.banner.bad{display:block;background:color-mix(in srgb,var(--red) 12%,var(--card));border:1px solid var(--red)}
nav{max-width:720px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
 padding:5px 12px;font-size:13px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:720px;margin:0 auto;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q{font-size:15px;font-weight:600;line-height:1.4}
.rank{color:var(--sub);font-size:12px;white-space:nowrap;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--sub);border:1px solid var(--line)}
.chip.frozen{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent);border-color:var(--accent)}
.chip.red{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red);border-color:var(--red);font-weight:600}
.chip.green{color:var(--green);border-color:var(--green)}
.chip.yellow{color:var(--yellow);border-color:var(--yellow)}
.meta{color:var(--sub);font-size:12px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:13px;-webkit-user-select:none;user-select:none}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;white-space:nowrap}
.dimnote{color:var(--sub);font-size:12px}
.ruletext{white-space:pre-wrap;word-break:break-word;background:var(--chip);border-radius:8px;
 padding:8px 10px;margin-top:8px;font-size:13px;color:var(--sub);max-height:260px;overflow:auto}
.cases a{color:var(--accent);word-break:break-all}
footer{max-width:720px;margin:18px auto 0;color:var(--sub);font-size:12px;line-height:1.7}
.skeleton{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>验盘师 <span style="font-weight:400;font-size:14px">· Polymarket 决议风险日报</span></h1>
  <div class="sub" id="dateline">加载中…</div>
</header>
<div class="banner" id="banner"></div>
<nav id="filters"></nav>
<main id="list"><div class="skeleton">正在拉取今日盘面…</div></main>
<footer id="foot"></footer>
<script>
"use strict";
/* 铁律：所有来自数据的字符串一律 textContent 渲染（B9：规则文本是不可信输入，禁 innerHTML）。*/
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const LS_KEY = "pltools-last-good-v1";
let FILTER = "all";

async function sha256hex(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function loadData() {
  const mResp = await fetch("manifest.json", { cache: "no-store" });
  if (!mResp.ok) throw new Error("manifest HTTP " + mResp.status);
  const manifest = await mResp.json();
  const f = manifest.files && manifest.files[0];
  if (!f) throw new Error("manifest 无文件清单");
  const sResp = await fetch(f.path, { cache: "no-store" });
  if (!sResp.ok) throw new Error("snapshot HTTP " + sResp.status);
  const buf = await sResp.arrayBuffer();
  if (crypto.subtle && location.protocol === "https:") {
    const hex = await sha256hex(buf);
    if (hex !== f.sha256) throw new Error("内容校验失败（sha256 不符）");
  }
  const payload = JSON.parse(new TextDecoder().decode(buf));
  try { localStorage.setItem(LS_KEY, JSON.stringify({ manifest, payload })); } catch (_) {}
  return { manifest, payload, fromCache: false };
}

function lastGood() {
  try { const j = JSON.parse(localStorage.getItem(LS_KEY)); if (j && j.payload) return { ...j, fromCache: true }; } catch (_) {}
  return null;
}

function bandChip(m) {
  const a = m.audit;
  if (!a) return $("span", "chip", "无初评");
  if (a.status === "frozen") return $("span", "chip frozen", "🧊 冻结中 · 规则变更复核中");
  if (a.status === "final" && a.risk_band) {
    const label = { green: "绿 · 低风险", yellow: "黄 · 中风险", red: "红 · 高风险" }[a.risk_band];
    return $("span", "chip " + a.risk_band, `终评 ${a.final_score} ｜ ${label}`);
  }
  if (a.risk_band === "red") return $("span", "chip red", "红 · CCL 硬规则");
  if (a.machine_score != null)
    return $("span", "chip", `初评 ${a.machine_score} ｜ 覆盖 ${a.covered_weight}/100 权重 · 待人工终评`);
  return $("span", "chip", "待评");
}

function fmtVol(v) {
  if (v == null) return "—";
  if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
  if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
  if (v >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K";
  return "$" + v.toFixed(0);
}

function matchFilter(m) {
  const a = m.audit || {};
  if (FILTER === "frozen") return a.status === "frozen";
  if (FILTER === "flags") return a.hard_flags && Object.keys(a.hard_flags).length > 0;
  if (FILTER === "disputed") return (m.disputes || []).some(d => d.was_disputed);
  return true;
}

function render(data) {
  const { manifest, payload, fromCache } = data;
  document.getElementById("dateline").textContent =
    `${payload.as_of_date} ｜ ${payload.market_count} 盘 ｜ 生成于 ${payload.generated_at} UTC`;
  const banner = document.getElementById("banner");
  banner.className = "banner"; banner.textContent = "";
  if (fromCache) { banner.className = "banner bad"; banner.textContent = "⚠️ 数据未更新：正在显示上一次校验通过的版本（网络或内容校验失败）。"; }
  else if (manifest.status !== "ok") { banner.className = "banner warn"; banner.textContent = "⚠️ 数据源标记为 " + manifest.status + "，请注意新鲜度。"; }

  const list = document.getElementById("list");
  list.textContent = "";
  const ms = (payload.markets || []).filter(matchFilter);
  if (!ms.length) list.append($("div", "skeleton", "该筛选下没有盘面。"));
  for (const m of ms) {
    const card = $("article", "card");
    const r1 = $("div", "row1");
    r1.append($("div", "q", m.question || "(无标题)"), $("div", "rank", "#" + (m.rank_by_volume ?? "—")));
    card.append(r1);
    const chips = $("div", "chips");
    chips.append(bandChip(m));
    const a = m.audit || {};
    for (const [k, v] of Object.entries(a.hard_flags || {})) {
      chips.append($("span", "chip red", k === "ccl_red" ? "CCL 红线" : k === "disclosure_delay" ? "披露延迟源" : "复杂盘"));
    }
    if ((m.rule_changes || []).length) chips.append($("span", "chip", `规则变更 ×${m.rule_changes.length}`));
    if ((m.disputes || []).some(d => d.was_disputed)) chips.append($("span", "chip yellow", "UMA 争议史"));
    if (m.data_freshness && m.data_freshness.is_stale) chips.append($("span", "chip yellow", "数据偏旧"));
    card.append(chips);
    const meta = $("div", "meta");
    meta.append($("span", null, "成交量 " + fmtVol(m.volume_usd)), $("span", null, "截止 " + (m.end_date || "—")));
    if (m.concentration && m.concentration.top10_share != null)
      meta.append($("span", null, "前十持仓 " + Math.round(m.concentration.top10_share * 100) + "%"));
    card.append(meta);
    card.append(details(m));
    list.append(card);
  }
  document.getElementById("foot").textContent =
    (payload.disclaimer || "") + " ｜ 评分口径 " + (ms[0]?.audit?.rubric_version || "A-v1.1") +
    " ｜ 初评=机器只评客观项，终评=人工把关（F3.1）。";
}

function details(m) {
  const d = $("details");
  d.append($("summary", null, "展开证据面板"));
  const a = m.audit;
  if (a && a.dimension_scores) {
    const t = $("table");
    const hr = $("tr"); ["项", "分", "说明"].forEach(h => hr.append($("th", null, h))); t.append(hr);
    const keys = Object.keys(a.dimension_scores).sort((x, y) => parseInt(x.slice(1)) - parseInt(y.slice(1)));
    for (const k of keys) {
      const dim = a.dimension_scores[k];
      const tr = $("tr");
      tr.append($("td", null, `${k}（权重${dim.weight}）`));
      tr.append($("td", null, dim.score == null ? "待人工" : String(dim.score)));
      tr.append($("td", "dimnote", dim.note || ""));
      t.append(tr);
    }
    d.append(t);
  } else d.append($("div", "dimnote", "本盘暂无初评数据。"));
  if ((m.verified_cases || []).length) {
    const c = $("div", "cases");
    c.append($("div", "dimnote", "已验真判例："));
    for (const vc of m.verified_cases) {
      const p = $("div");
      p.append($("span", null, "· " + vc.title + " "));
      if (typeof vc.source_url === "string" && vc.source_url.startsWith("https://")) {
        const link = $("a", null, "来源"); link.href = vc.source_url; link.rel = "noopener nofollow"; link.target = "_blank";
        p.append(link);
      }
      c.append(p);
    }
    d.append(c);
  }
  if (m.raw_rule_text) {
    const rt = $("div", "ruletext"); rt.textContent = m.raw_rule_text;  // 纯文本渲染，B9
    const cap = $("div", "dimnote"); cap.textContent = "规则原文（第三方不可信文本，仅供核对）：";
    d.append(cap, rt);
  }
  return d;
}

function buildFilters() {
  const defs = [["all", "全部"], ["frozen", "🧊 冻结"], ["flags", "硬旗标"], ["disputed", "争议史"]];
  const nav = document.getElementById("filters");
  for (const [key, label] of defs) {
    const b = $("button", key === FILTER ? "on" : "", label);
    b.onclick = () => { FILTER = key; [...nav.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); if (window.__data) render(window.__data); };
    nav.append(b);
  }
}

(async () => {
  buildFilters();
  try {
    window.__data = await loadData();
  } catch (e) {
    const cached = lastGood();
    if (cached) window.__data = cached;
    else { document.getElementById("list").textContent = ""; document.getElementById("list").append($("div", "skeleton", "加载失败：" + e.message)); return; }
  }
  render(window.__data);
  if ("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
